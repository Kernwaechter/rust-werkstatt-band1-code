[package]
name = "projekt_putzer"
version = "0.1.0"
edition = "2021"
description = "Ein Werkstatt-Tool zum Aufspüren und Bereinigen verstaubter Build-Ordner"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
